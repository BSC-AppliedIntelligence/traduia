<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archive - Link3rs Backstage</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>

    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="/dashboard" class="sidebar-logo">
                    <img src="/static/img/bscTranslatorLogo.png" alt="BSC Translator">
                </a>
            </div>
            <nav class="sidebar-nav">
                <a href="/dashboard" class="nav-item">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
                    Events
                </a>
                <a href="/archive" class="nav-item active">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4"/></svg>
                    Archive
                </a>
                <div class="nav-divider"></div>
                <a href="/account" class="nav-item">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                    Account
                </a>
                <button class="nav-item" onclick="Auth.signOut()">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                    Logout
                </button>
            </nav>
            <div class="sidebar-branding">
                <a href="https://www.link3rs.com" target="_blank"><img src="/static/img/builtByLink3rs.png" alt="Built by Link3rs"></a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="page-header">
                <div>
                    <h1 class="page-title">Archive</h1>
                    <p class="page-subtitle">View and restore archived events</p>
                </div>
            </header>

            <div class="page-content">
                <div id="eventsGrid" class="events-grid">
                    <div class="loading"><div class="spinner"></div></div>
                </div>
                
                <div id="emptyState" class="empty-state hidden">
                    <div class="empty-state-icon">📦</div>
                    <h3 class="empty-state-title">No archived events</h3>
                    <p class="empty-state-text">Events you archive will appear here.</p>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Server-injected configuration (from .env)
        window.__SUPABASE_URL__ = '{{ SUPABASE_URL }}';
        window.__SUPABASE_ANON_KEY__ = '{{ SUPABASE_ANON_KEY }}';
        window.__APP_URL__ = '{{ APP_URL }}';
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/static/js/config.js"></script>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/db.js"></script>
    <script>
        let currentUser = null;

        async function init() {
            if (window.SUPABASE_CONFIG_ERROR) return;
            
            const auth = await Auth.requireAuth();
            if (!auth) return;
            
            currentUser = await Auth.getUser();
            await loadEvents();
        }

        async function loadEvents() {
            const grid = document.getElementById('eventsGrid');
            const emptyState = document.getElementById('emptyState');
            
            try {
                const events = await DB.getEvents(currentUser.id, 'archived');
                
                if (events.length === 0) {
                    grid.classList.add('hidden');
                    emptyState.classList.remove('hidden');
                } else {
                    emptyState.classList.add('hidden');
                    grid.classList.remove('hidden');
                    
                    grid.innerHTML = events.map(e => `
                        <div class="event-card">
                            <span class="event-code">${e.event_code}</span>
                            <h3 class="event-title">${escapeHtml(e.title)}</h3>
                            <div class="event-meta">
                                <span><span class="status-dot inactive"></span>Archived</span>
                                <span>${new Date(e.created_at).toLocaleDateString()}</span>
                            </div>
                            <div class="flex gap-2 mt-3">
                                <button class="btn btn-secondary btn-sm" onclick="restoreEvent('${e.id}')">Restore</button>
                                <button class="btn btn-ghost btn-sm text-danger" onclick="deleteEvent('${e.id}')">Delete</button>
                            </div>
                        </div>
                    `).join('');
                }
            } catch (e) {
                grid.innerHTML = `<p class="text-danger">Error loading events: ${e.message}</p>`;
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function restoreEvent(id) {
            if (confirm('Restore this event?')) {
                await DB.updateEvent(id, { status: 'active' });
                await loadEvents();
            }
        }

        async function deleteEvent(id) {
            if (confirm('Permanently delete this event? This cannot be undone.')) {
                await DB.deleteEvent(id);
                await loadEvents();
            }
        }

        init();
    </script>
</body>
</html>
