<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Link3rs Backstage</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>

    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="/dashboard" class="sidebar-logo">
                    <img src="/static/img/bscTranslatorLogo.png" alt="BSC Translator">
                </a>
            </div>
            <nav class="sidebar-nav">
                <a href="/dashboard" class="nav-item active">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
                    Events
                </a>
                <a href="/archive" class="nav-item">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4"/></svg>
                    Archive
                </a>
                <div class="nav-divider"></div>
                <a href="/account" class="nav-item">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                    Account
                </a>
                <a href="/admin" class="nav-item" id="adminLink" style="display: none;">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"/></svg>
                    Admin
                </a>
                <button class="nav-item" onclick="Auth.signOut()">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                    Logout
                </button>
            </nav>
            <div class="sidebar-branding">
                <a href="https://www.link3rs.com" target="_blank"><img src="/static/img/builtByLink3rs.png" alt="Built by Link3rs"></a>
            </div>
            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar" id="userAvatar">?</div>
                    <div>
                        <div class="user-name" id="userName">Loading...</div>
                        <div class="user-email" id="userEmail">...</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="page-header" style="display: flex; align-items: center; justify-content: space-between; background: transparent; border: none; backdrop-filter: none;">
                <div>
                    <h1 class="page-title">Events</h1>
                    <p class="page-subtitle">Manage your live translation events</p>
                </div>
                <button class="btn btn-primary" onclick="openEventModal()">
                    + New Event
                </button>
            </header>

            <div class="page-content" style="padding-top: 16px;">
                <div id="eventsGrid" class="events-grid">
                    <div class="loading"><div class="spinner"></div></div>
                </div>
                
                <div id="emptyState" class="empty-state hidden">
                    <div class="empty-state-icon">📡</div>
                    <h3 class="empty-state-title">No events yet</h3>
                    <p class="empty-state-text">Create your first live translation event to get started.</p>
                    <button class="btn btn-primary" onclick="openEventModal()">Create Event</button>
                </div>
            </div>
        </main>
    </div>

    <!-- Create Event Modal -->
    <div id="eventModal" class="modal-overlay hidden" onclick="if(event.target===this)closeEventModal()">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">Create Event</h3>
                <button class="modal-close" onclick="closeEventModal()">✕</button>
            </div>
            <form id="eventForm">
                <div class="modal-body">
                    <div class="form-group">
                        <label class="form-label">Event Title</label>
                        <input type="text" id="eventTitle" class="form-input" placeholder="My Conference" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Description (optional)</label>
                        <textarea id="eventDesc" class="form-input" rows="3" placeholder="Brief description of your event"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeEventModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Create</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Server-injected configuration (from .env)
        window.__SUPABASE_URL__ = '{{ SUPABASE_URL }}';
        window.__SUPABASE_ANON_KEY__ = '{{ SUPABASE_ANON_KEY }}';
        window.__APP_URL__ = '{{ APP_URL }}';
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/static/js/config.js"></script>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/db.js"></script>
    <script>
        let currentUser = null;
        let currentProfile = null;

        async function init() {
            if (window.SUPABASE_CONFIG_ERROR) return;
            
            const auth = await Auth.requireAuth();
            if (!auth) return;
            
            currentUser = await Auth.getUser();
            currentProfile = auth.profile;
            
            // Update UI
            document.getElementById('userName').textContent = auth.profile?.full_name || currentUser.email.split('@')[0];
            document.getElementById('userEmail').textContent = currentUser.email;
            document.getElementById('userAvatar').textContent = (auth.profile?.full_name || currentUser.email)[0].toUpperCase();
            
            // Show admin link if admin
            if (auth.admin) {
                document.getElementById('adminLink').style.display = 'flex';
            }
            
            await loadEvents();
        }

        async function loadEvents() {
            const grid = document.getElementById('eventsGrid');
            const emptyState = document.getElementById('emptyState');
            
            try {
                const events = await DB.getEvents(currentUser.id);
                
                if (events.length === 0) {
                    grid.classList.add('hidden');
                    emptyState.classList.remove('hidden');
                } else {
                    emptyState.classList.add('hidden');
                    grid.classList.remove('hidden');
                    
                    grid.innerHTML = events.map(e => `
                        <div class="event-card" onclick="location.href='/event/${e.event_code}'">
                            <span class="event-code">${e.event_code}</span>
                            <h3 class="event-title">${escapeHtml(e.title)}</h3>
                            <div class="event-meta">
                                <span><span class="status-dot active"></span>Active</span>
                                <span>${new Date(e.created_at).toLocaleDateString()}</span>
                            </div>
                        </div>
                    `).join('');
                }
            } catch (e) {
                grid.innerHTML = `<p class="text-danger">Error loading events: ${e.message}</p>`;
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function openEventModal() {
            document.getElementById('eventModal').classList.remove('hidden');
        }

        function closeEventModal() {
            document.getElementById('eventModal').classList.add('hidden');
            document.getElementById('eventForm').reset();
        }

        document.getElementById('eventForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const title = document.getElementById('eventTitle').value;
            const description = document.getElementById('eventDesc').value;
            
            try {
                const event = await DB.createEvent(currentUser.id, title, description);
                closeEventModal();
                window.location.href = `/event/${event.event_code}`;
            } catch (err) {
                alert('Error creating event: ' + err.message);
            }
        });

        init();
    </script>
</body>
</html>
