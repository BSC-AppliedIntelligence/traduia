<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Link3rs Backstage</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>

    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="/dashboard" class="sidebar-logo">
                    <img src="/static/img/bscTranslatorLogo.png" alt="BSC Translator">
                </a>
            </div>
            <nav class="sidebar-nav">
                <a href="/dashboard" class="nav-item">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
                    Events
                </a>
                <a href="/archive" class="nav-item">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4"/></svg>
                    Archive
                </a>
                <div class="nav-divider"></div>
                <a href="/account" class="nav-item">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                    Account
                </a>
                <a href="/admin" class="nav-item active">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"/></svg>
                    Admin
                </a>
                <button class="nav-item" onclick="Auth.signOut()">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                    Logout
                </button>
            </nav>
            <div class="sidebar-branding">
                <a href="https://www.link3rs.com" target="_blank"><img src="/static/img/builtByLink3rs.png" alt="Built by Link3rs"></a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="page-header">
                <div>
                    <h1 class="page-title">Admin Panel</h1>
                    <p class="page-subtitle">Manage users and approvals</p>
                </div>
            </header>

            <div class="page-content">
                <div class="tabs">
                    <button class="tab active" data-tab="pending">Pending Approval</button>
                    <button class="tab" data-tab="users">All Users</button>
                </div>

                <!-- Pending Tab -->
                <div id="tab-pending" class="tab-content active">
                    <div class="card">
                        <h3 class="card-title mb-3">Pending Approvals</h3>
                        <div id="pendingList">
                            <div class="loading"><div class="spinner"></div></div>
                        </div>
                    </div>
                </div>

                <!-- Users Tab -->
                <div id="tab-users" class="tab-content">
                    <div class="card">
                        <h3 class="card-title mb-3">All Users</h3>
                        <div id="usersList">
                            <div class="loading"><div class="spinner"></div></div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Server-injected configuration (from .env)
        window.__SUPABASE_URL__ = '{{ SUPABASE_URL }}';
        window.__SUPABASE_ANON_KEY__ = '{{ SUPABASE_ANON_KEY }}';
        window.__APP_URL__ = '{{ APP_URL }}';
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/static/js/config.js"></script>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/db.js"></script>
    <script>
        let currentUser = null;

        async function init() {
            if (window.SUPABASE_CONFIG_ERROR) return;
            
            const auth = await Auth.requireAuth();
            if (!auth) return;
            
            // Check admin
            if (!auth.admin) {
                alert('Access denied. Admin only.');
                window.location.href = '/dashboard';
                return;
            }
            
            currentUser = await Auth.getUser();
            
            setupTabs();
            await loadPending();
        }

        function setupTabs() {
            document.querySelectorAll('.tab').forEach(tab => {
                tab.addEventListener('click', async () => {
                    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                    tab.classList.add('active');
                    document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
                    
                    if (tab.dataset.tab === 'users') {
                        await loadUsers();
                    }
                });
            });
        }

        async function loadPending() {
            const list = document.getElementById('pendingList');
            
            try {
                const users = await DB.getPendingUsers();
                
                if (users.length === 0) {
                    list.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">✓</div>
                            <p class="text-muted">No pending approvals</p>
                        </div>
                    `;
                } else {
                    list.innerHTML = `
                        <table class="users-table">
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Email</th>
                                    <th>Requested</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${users.map(u => `
                                    <tr>
                                        <td style="color: var(--white);">${escapeHtml(u.full_name || 'No name')}</td>
                                        <td>${escapeHtml(u.email || '-')}</td>
                                        <td>${new Date(u.created_at).toLocaleDateString()}</td>
                                        <td>
                                            <button class="btn btn-primary btn-sm" onclick="approveUser('${u.id}')">
                                                Approve
                                            </button>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    `;
                }
            } catch (e) {
                list.innerHTML = `<p class="text-danger">Error: ${e.message}</p>`;
            }
        }

        async function loadUsers() {
            const list = document.getElementById('usersList');
            
            try {
                const users = await DB.getAllUsers();
                
                list.innerHTML = `
                    <table class="users-table">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Status</th>
                                <th>Role</th>
                                <th>Joined</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${users.map(u => `
                                <tr>
                                    <td style="color: var(--white);">${escapeHtml(u.full_name || 'No name')}</td>
                                    <td>${escapeHtml(u.email || '-')}</td>
                                    <td>
                                        <span class="badge ${u.is_approved ? 'badge-success' : 'badge-warning'}">
                                            ${u.is_approved ? 'Approved' : 'Pending'}
                                        </span>
                                    </td>
                                    <td>
                                        <span class="badge ${u.is_admin ? 'badge-info' : 'badge-success'}">
                                            ${u.is_admin ? 'Admin' : 'User'}
                                        </span>
                                    </td>
                                    <td>${new Date(u.created_at).toLocaleDateString()}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
            } catch (e) {
                list.innerHTML = `<p class="text-danger">Error: ${e.message}</p>`;
            }
        }

        async function approveUser(userId) {
            try {
                await DB.approveUser(userId, currentUser.id);
                await loadPending();
            } catch (e) {
                alert('Error: ' + e.message);
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        init();
    </script>
</body>
</html>
